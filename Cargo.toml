[package]
name = "folder-into-json"
version = "1.2.0"
edition = "2021"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zstd = { version = "0.14.3", default-features = false }

[features]
default = []
# Aktiviert über Nix das dynamische Linken via pkg-config
system-zstd = ["zstd/pkg-config"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
